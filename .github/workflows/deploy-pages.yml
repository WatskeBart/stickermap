# .github/workflows/deploy-pages.yml
#
# Deploys this branch to GitHub Pages whenever it is pushed.
#
# This stub exists only because GitHub resolves push-event workflows from the
# branch that was pushed, so something has to live here. The actual steps are
# in the workflow of the same name on develop, reused via workflow_call, which
# keeps this file small enough that there is nothing to drift.
#
# Manual runs are started from that develop copy in the Actions tab, not here.
#
# Note: pushes made by publish-helm-pages.yml use the default GITHUB_TOKEN,
# which does not start new workflow runs, so chart releases do not deploy
# twice - that workflow already calls deploy-pages itself.

name: Deploy gh-pages content

on:
  push:
    branches:
      - gh-pages

jobs:
  deploy:
    name: Publish gh-pages to GitHub Pages
    # Full owner/repo@ref form is required: a local ./ reference would resolve
    # against this branch, which does not contain the implementation.
    uses: WatskeBart/stickermap/.github/workflows/deploy-pages.yml@develop
    permissions:
      contents: read
      pages: write
      id-token: write
